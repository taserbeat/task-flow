services:
  db:
    build:
      context: ./.docker/postgres
      dockerfile: Dockerfile
    image: taskflow-postgres:${TF_POSTGRES_IMAGE_TAG:-latest}
    container_name: tf_demo_postgres

    ports:
      - 15431:5432
    restart: always
    environment:
      - POSTGRES_USER=${TF_POSTGRES_SUPERUSER_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${TF_POSTGRES_SUPERUSER_PASSWORD:-postgres}
      - TZ=Asia/Tokyo
      - LANG=ja_JP.utf8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
    volumes:
      - tf_demo_postgres_volume:/var/lib/postgresql

  app:
    build:
      context: ./.docker/demo
      dockerfile: Dockerfile
    image: taskflow-demo:${TF_DEV_IMAGE_TAG:-latest}
    container_name: tf_demo_app
    ports:
      - 8080:5000
      - 8081:5001
      - 3001:3000
    restart: always
    environment:
      - TZ=Asia/Tokyo
      - LANG=ja_JP.utf8
      - ConnectionStrings__DefaultConnection=Host=db:5432;Username=tfApp;Password=tfApp;Database=taskflow_dev
      - ConnectionStrings__MigrateConnection=Host=db:5432;Username=tfAdmin;Password=tfAdmin;Database=taskflow_dev
      - TF_ENABLE_REDIS=false
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
    volumes:
      - .:/workspace

volumes:
  tf_demo_postgres_volume:
